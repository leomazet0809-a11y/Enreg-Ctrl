<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta http-equiv="Cache-Control" content="no-cache">
<title>Enregistrements Contrôles</title>
<meta name="description" content="Rapports de contrôle d'entrée enregistrés dans un classeur Excel.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%232563eb'/%3E%3Cpath d='M10 9.5h9M10 14h12M10 18.5h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M17.5 22l2.3 2.3 4.7-4.8' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script>
  /* Thème appliqué avant l'affichage pour éviter un flash : choix mémorisé, sinon réglage du système */
  (function(){
    var t = null;
    try{ t = localStorage.getItem('ec.theme'); }catch(e){}
    if(t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    var z = null;
    try{ z = parseFloat(localStorage.getItem('ec.police')); }catch(e){}
    if(z >= 0.7 && z <= 1.6) document.documentElement.style.setProperty('--zoom', z);
  })();
</script>
<link rel="stylesheet" href="css/app.css?v=20261103-9">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-logo" id="brand-logo"></span>
    <span class="brand-txt"><b>Enregistrements Contrôle d'entrée</b></span>
  </div>
  <div class="topright">
    <div class="fichier" id="fichier" role="status" aria-live="polite"></div>
    <nav class="menu-top" id="menu-top" aria-label="Menu principal">
      <button class="icon-btn" id="h-analyse" type="button" title="Analyses des dérives" aria-label="Analyses des dérives"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 4v16h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 15l3.5-4.5 3 3 5-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="h-referentiel" type="button" title="Référentiel" aria-label="Référentiel"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5M8 7.5h8M8 11h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="h-parametres" type="button" title="Paramètres" aria-label="Paramètres"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
    </nav>
    <button class="btn-save" id="b-enregistrer" type="button" aria-keyshortcuts="Control+S"></button>
  </div>
</header>
<main class="wrap" id="main"></main>

<aside class="viewpane" id="viewpane">
  <div class="vh"><b id="vp-nom"></b>
    <button id="vp-ext" title="Ouvrir dans le lecteur PDF du poste">Ouvrir hors de l'appli</button>
    <button id="vp-close">Fermer</button>
  </div>
  <iframe id="vp-frame" title="Document de méthode de contrôle"></iframe>
  <div class="vf" id="vp-info"></div>
</aside>

<input type="file" id="filepick" class="file" accept=".csv,.txt,.json">
<div class="accueil" id="accueil" hidden></div>

<script src="lib/xlsx.full.min.js"></script>
<script src="js/app.js?v=20261103-9"></script>
<script src="js/partage.js?v=20261103-9"></script>
<script src="js/classeur.js?v=20261103-9"></script>

</body>
</html>
